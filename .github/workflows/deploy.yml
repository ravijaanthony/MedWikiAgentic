# ---------------------------------------------------------------------------
# MedWiki — Build & Deploy to DigitalOcean Droplet 
#
# Trigger: push to `main`
#
# What this does:
#   1. Builds the backend and frontend Docker images in parallel.
#   2. Pushes both to GitHub Container Registry (GHCR) tagged with the Git
#      SHA and `latest`.
#   3. SCPs the production Compose file to the Droplet.
#   4. SSHs into the Droplet, pulls the new images, and does a zero-downtime
#      `docker compose up -d`.
#   5. Cleans up dangling images.
#
# ── Required GitHub Secrets ─────────────────────────────────────────────────
#   DROPLET_HOST         Public IP or hostname of the Droplet (e.g. 167.71.21.93)
#   DROPLET_USER         SSH user on the Droplet (e.g. root or deploy)
#   DROPLET_SSH_KEY      Private key whose public half is in
#                        ~/.ssh/authorized_keys on the Droplet
#   VITE_SUPABASE_URL    Baked into the frontend bundle at build time
#   VITE_SUPABASE_ANON_KEY  Baked into the frontend bundle at build time
#
# ── One-time Droplet setup ──────────────────────────────────────────────────
#   1. Create a DigitalOcean Droplet using the "Docker on Ubuntu" marketplace
#      image — Docker + Compose are pre-installed.
#   2. Add the deploy public key to ~/.ssh/authorized_keys.
#   3. Open port 80 (and 443 if you add TLS later) in the Droplet firewall.
#   4. Create the runtime secrets file:
#        mkdir -p /opt/medwiki/backend
#        nano /opt/medwiki/backend/.env   # paste contents of backend/.env.example
#   5. Log GHCR in once so Docker has credentials cached (the workflow
#      re-authenticates on every deploy, but this is a good smoke test):
#        echo "<GITHUB_PAT>" | docker login ghcr.io -u <username> --password-stdin
# ---------------------------------------------------------------------------

name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allow manual trigger from the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel an in-progress deploy; queue instead

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/medwiki-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/medwiki-frontend

# ============================================================================
# JOB 1 — Build & push backend image
# ============================================================================
jobs:
  build-backend:
    name: Build backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR

    outputs:
      image: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # ============================================================================
  # JOB 2 — Build & push frontend image
  #         Runs in parallel with build-backend
  # ============================================================================
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Vite bakes these into the bundle — they must be supplied at build time
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ============================================================================
  # JOB 3 — Deploy to Droplet
  #         Runs after both builds succeed
  # ============================================================================
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
      packages: read   # GITHUB_TOKEN must read GHCR when the Droplet pulls images
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Copy production Compose file to Droplet ────────────────────────────
      - name: Copy docker-compose.prod.yml to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/medwiki

      # ── Pull new images & restart services ────────────────────────────────
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_ACTOR,GHCR_OWNER,IMAGE_TAG
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"

            # ── 0. Ensure Docker + Compose are installed ─────────────────────
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found; installing..."
              apt-get update -y
              apt-get install -y docker.io docker-compose-plugin
              systemctl enable --now docker
            fi
            if ! docker compose version >/dev/null 2>&1; then
              echo "Docker Compose plugin not found; installing..."
              apt-get update -y
              apt-get install -y docker-compose-plugin
            fi

            # ── 1. Authenticate with GHCR ──────────────────────────────────
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            # ── 2. Export variables Compose will interpolate ───────────────
            export GHCR_OWNER IMAGE_TAG
            cd /opt/medwiki

            # ── 3. Pull the new images explicitly (fail fast before stopping) ─
            docker compose -f docker-compose.prod.yml pull

            # ── 4. Recreate containers from the pulled images ──────────────
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # ── 5. Wait for the backend health check to pass ───────────────
            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 24); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' \
                       "$(docker compose -f docker-compose.prod.yml ps -q backend)" 2>/dev/null || echo "starting")
              echo "  attempt $i/24 — $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "Backend is healthy."
                break
              fi
              if [ "$i" = "24" ]; then
                echo "Backend failed to become healthy within 2 minutes."
                docker compose -f docker-compose.prod.yml logs --tail=50 backend
                exit 1
              fi
              sleep 5
            done

            # ── 6. Remove dangling images to free disk space ───────────────
            docker image prune -f

            echo "Deployment complete — $(date -u)"

      # ── Smoke-test the live endpoint from the Actions runner ───────────────
      - name: Smoke test /health
        run: |
          echo "Probing http://${{ secrets.DROPLET_HOST }}/api/health ..."
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "http://${{ secrets.DROPLET_HOST }}/api/health" || echo "000")
            echo "  attempt $i — HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            sleep 10
          done
          echo "Health check failed after 5 attempts."
          exit 1
