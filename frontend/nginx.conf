server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with aggressive caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy /api/* → FastAPI backend (strips the /api prefix to match backend routes)
    # In Docker Compose, the backend service should be named "backend".
    # Override via NGINX_BACKEND_HOST build arg or by editing this directly.
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep SSE connections alive (used by /consultations/{id}/events)
        proxy_buffering    off;
        proxy_read_timeout 3600s;
    }

    # React Router — fall back to index.html for all unmatched paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
